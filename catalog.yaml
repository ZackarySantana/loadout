          skills: []
          kit:
            path: kits/loadout-agent-clis/claude-cli
            manifest:
              schemaVersion: 1
              id: loadout-claude-cli
              description: Run non-interactive Claude CLI conversations
              requires: []
              questions:
                placement:
                  type: choice
                  message: Add Claude CLI guidance to context or as a skill?
                  choices:
                    - context
                    - skill
              outputs:
                - type: instructions
                  source: instructions.md
                  scope: .
                  when:
                    answer: placement
                    equals: context
                - type: skill
