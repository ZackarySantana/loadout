schemaVersion: 1
id: codex-cli
description: Run non-interactive Codex CLI conversations
questions:
  placement:
    type: choice
    message: Add Codex CLI guidance to context or as a skill?
    choices: [context, skill]
outputs:
  - type: instructions
    source: instructions.md
    when:
      answer: placement
      equals: context
  - type: skill
    source: skills/loadout-codex-cli
    when:
      answer: placement
      equals: skill
