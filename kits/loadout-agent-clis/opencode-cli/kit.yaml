schemaVersion: 1
id: opencode-cli
description: Run non-interactive OpenCode CLI conversations
questions:
  placement:
    type: choice
    message: Add OpenCode CLI guidance to context or as a skill?
    choices: [context, skill]
outputs:
  - type: instructions
    source: instructions.md
    when:
      answer: placement
      equals: context
  - type: skill
    source: skills/loadout-opencode-cli
    when:
      answer: placement
      equals: skill
