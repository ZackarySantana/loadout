id: subagent-review
name: Focused review agent
description: A native review agent with Codex shell disabled, Claude read tools, and OpenCode edit/shell denied. Codex still inherits session permissions.
questions:
  - id: enabled
    type: boolean
    label: Include the review agent?
    default: true
  - id: focus
    type: input
    label: What should the reviewer focus on?
    default: correctness and security
outputs:
  - type: agent
    name: loadout-reviewer
    description: Review proposed changes for {{focus}} and return actionable findings.
    when:
      question: enabled
      equals: true
    instructions: |
      Review the proposed changes for {{focus}}.
      Do not edit files or run commands. Read relevant source files and return
      only concrete findings, ordered by severity, with file references.
      If there are no findings, say so and mention remaining uncertainty.
    options:
      codex:
        features:
          shell_tool: false
      claude:
        tools: [Read, Grep, Glob]
      opencode:
        permissions:
          - action: edit
            resource: "*"
            effect: deny
          - action: shell
            resource: "*"
            effect: deny
