id: write-kit
name: Write a kit
description: Author declarative Loadout kits and catalog entries.
outputs:
  - type: skill
    name: loadout-write-kit
    files:
      SKILL.md: |
        ---
        name: loadout-write-kit
        description: Create or edit declarative Loadout kit YAML and catalog JSON when asked to author a kit.
        ---

        State each requirement once as a direct instruction, including its exceptions. Preserve its exact trigger and scope. Do not add unrequested rules or steps.

        Store each kit as one YAML file. All instruction text, skill files, agent definitions, and optional file contents are inline strings. Kits do not execute code or load output source files. Use the current repository's src/domain/kit.ts and src/domain/subagents.ts as the exact schemas when available.

        Adapt this minimal example:

        ```yaml
        id: review
        name: Review changes
        description: Review changes and optionally focus on tests.
        questions:
          - id: tests
            label: Focus on test coverage?
            type: boolean
            default: true
        outputs:
          - type: instructions
            content: Review changes for actionable defects before suggesting cosmetic edits.
          - type: skill
            name: review
            when: { question: tests, equals: true }
            files:
              SKILL.md: |
                ---
                name: review
                description: Review test coverage when asked to review changes.
                ---

                Read the diff and relevant tests. Report untested behavior and actionable defects with file locations and suggested fixes.
        ```

        - Kit fields are id, name, description, questions, and outputs. Require id, name, and at least one output. Use unique lowercase letters, digits, and hyphens for IDs and skill names, starting with a letter or digit. Unknown fields are rejected.
        - Questions are an ordered array of objects with id, label, and type. All types accept an optional description string for concise help, shown in gray italics after the controls. Description is metadata, not interpolated or added to generated content. Types are input, boolean, select, and multi-select. Only input accepts required, which defaults to true. Input defaults are strings; boolean defaults are booleans; select defaults are choice values; multi-select defaults are arrays of choice values.
        - Select and multi-select require nonempty choices arrays of objects with value and label. Choice values are unique strings. Defaults must match choices. Boolean defaults to false and multi-select to an empty array; select without a default uses its first choice.
        - Questions and outputs may have when with question and exactly one of equals or includes. Use equals for a string or boolean answer and includes for membership in a multi-select answer. Conditional questions refer only to earlier questions. Outputs may refer to any declared question.
        - Interpolate an answer in content by surrounding its question ID with two opening and two closing curly braces. Arrays become comma-separated text. Interpolation applies to instruction content, skill file contents, file content, and agent descriptions/instructions. It never changes paths, names, harness choices, or native options. Guard content that refers to conditional answers with a matching condition so hidden answers are not referenced.
        - Instructions have type: instructions and content, with optional when. Loadout combines active instruction fragments and sends them to the user's configured instruction locations. Do not hardcode destination filenames in a new instruction output.
        - Skills have type: skill, name, and files mapping relative paths to inline strings. Include SKILL.md with name and description frontmatter. Link supporting Markdown from SKILL.md. Loadout writes or links the skill's managed files under the user's configured skill locations for the selected scope.
        - Subagents have type: agent, a fixed lowercase name, a nonempty description, and nonempty instructions. Optional harnesses selects codex, claude, and/or opencode; omitted harnesses includes all three. Optional options has native codex, claude, and opencode objects with model strings; OpenCode models use native slash-separated identifiers. Claude accepts tools, chosen from Read, Grep, Glob, LSP, WebFetch, and WebSearch. Codex accepts a nonempty features object with shell_tool, apps, plugins, memories, and request_permissions_tool set only to false to disable capabilities; it still inherits parent sandbox and approval policy, and disabling shell alone is not a read-only sandbox. OpenCode accepts permissions, an ordered list of 1–128 strict objects with action (nonblank, at most 256 characters), resource (nonblank, at most 4096 characters), and effect (allow, ask, or deny). Permission strings must not contain controls, line breaks, or unpaired Unicode surrogates. Patterns are literal, not answer templates; last matching rule wins. OpenCode applies global then agent rules, not the parent's agent-specific rules. Use when for conditional agents. Native formats differ and are never cross-linked. Omitted controls preserve host behavior; instructions are not a sandbox. Current Codex standalone agent discovery is required.
        - Optional files have type: file, a fixed relative path, and inline content; add when to make them conditional. Paths must not be absolute or contain backslashes, empty segments, dot segments, or parent traversal. Use static paths without answer substitutions.
        - Do not add shell hooks, source scripts, or executable payloads. Selection and scope are application state, not kit fields.

        For a project kit, put its YAML file directly under .loadout/kits/. The automatic Repo catalog discovers it without an index or registration. For an external catalog, add an entry to a catalog JSON object with id, name, and kits. Each kits entry has id, name, and source pointing to the YAML file relative to the catalog. Put the description only in the kit YAML, not the catalog JSON. References must stay within the catalog directory and, for HTTPS catalogs, the same origin. Keep each entry's id and name aligned with its kit. Catalog kit IDs must be unique.

        Validate against the strict schemas, inspect conditional visibility with valid answers, and review the planned files before applying. Use catalog/kits/project-context.yaml, catalog/kits/subagent-review.yaml, and site/index.html as fuller examples when available. The CLI guide command explains agent-assisted discovery and explicit human approval; never self-confirm a plan.
