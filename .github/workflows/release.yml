name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auth_diagnostics:
        description: Non-publishing npm auth diagnostics
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main' && !inputs.auth_diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
      - run: mise exec -- npm ci --ignore-scripts
      - name: Open or update release PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1 (Changesets CLI 2)
        with:
          github-token: ${{ github.token }}
          version: mise exec -- bun scripts/version.ts
          commitMode: github-api
          title: "Release Loadout"
          commit: "chore: version Loadout"
          createGithubReleases: false
      - name: Explain automatic publishing in release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .body > "$RUNNER_TEMP/release-pr-body.md"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const body = readFileSync(join(process.env.RUNNER_TEMP, "release-pr-body.md"), "utf8").replace(
            "publish to npm yourself or [setup this action to publish automatically](https://github.com/changesets/action#with-publishing)",
            "the package will be published to npm automatically by this workflow's OIDC-protected publish job",
          );
          writeFileSync(join(process.env.RUNNER_TEMP, "release-pr-body.json"), JSON.stringify({ body }));
          NODE
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --input "$RUNNER_TEMP/release-pr-body.json" > /dev/null

  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false' && !inputs.auth_diagnostics
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
      - run: mise exec -- npm ci --ignore-scripts
      - run: mise exec -- npm run check
      - name: Publish only unpublished versions using npm OIDC
        run: mise exec -- bun scripts/publish.ts --publish

  auth-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.auth_diagnostics
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: false
      - run: mise exec -- npm ci --ignore-scripts
      - name: Inspect public OIDC identity without logging credentials
        run: |
          mise exec -- node --version
          mise exec -- npm --version
          mise exec -- node --input-type=module <<'NODE'
          const env = process.env;
          console.log(JSON.stringify({
            repository: env.GITHUB_REPOSITORY,
            ref: env.GITHUB_REF,
            workflow_ref: env.GITHUB_WORKFLOW_REF,
            sha: env.GITHUB_SHA,
            GITHUB_ACTIONS: Boolean(env.GITHUB_ACTIONS),
            CI_is_false: env.CI === "false",
            ACTIONS_ID_TOKEN_REQUEST_URL: Boolean(env.ACTIONS_ID_TOKEN_REQUEST_URL),
            ACTIONS_ID_TOKEN_REQUEST_TOKEN: Boolean(env.ACTIONS_ID_TOKEN_REQUEST_TOKEN),
            NPM_ID_TOKEN: Boolean(env.NPM_ID_TOKEN),
            NODE_AUTH_TOKEN: Boolean(env.NODE_AUTH_TOKEN),
          }, null, 2));
          if (env.ACTIONS_ID_TOKEN_REQUEST_URL && env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) {
            try {
              const url = new URL(env.ACTIONS_ID_TOKEN_REQUEST_URL);
              url.searchParams.set("audience", "npm:registry.npmjs.org");
              const response = await fetch(url, {
                headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
                signal: AbortSignal.timeout(20_000),
              });
              if (!response.ok) {
                console.error(`GitHub OIDC request failed: HTTP ${response.status}`);
              } else {
                const { value } = await response.json();
                const payload = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString("utf8"));
                const claims = ["iss", "aud", "sub", "repository", "repository_owner", "ref", "workflow_ref", "job_workflow_ref", "environment"];
                console.log(JSON.stringify(Object.fromEntries(claims.map((key) => [key, payload[key] ?? null])), null, 2));
              }
            } catch {
              console.error("GitHub OIDC request or public-claim decoding failed (details withheld)");
            }
          }
          NODE
      - name: Build and pack without publishing
        run: mise exec -- bun scripts/publish.ts --dry-run
      - name: Diagnose npm OIDC exchange without publishing
        run: |
          version="$(mise exec -- node -p 'require("./package.json").version')"
          tarball=".release/tarballs/lidtop-loadout-${version}.tgz"
          echo "Dry-run auth diagnostics only; success does not prove publish permission."
          mise exec -- npm publish "$tarball" --dry-run --ignore-scripts --access public --provenance --registry https://registry.npmjs.org/ --tag latest --loglevel verbose
